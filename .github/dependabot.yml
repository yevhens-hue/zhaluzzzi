version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kiev"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kiev"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"
